[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohamlab-voicestudio"
version = "0.1.0b3"
description = "Modular OhamLab voice SDK: Hindi TTS, voice cloning, ASR, voice chat and training utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OhamLab"}]
dependencies = ["numpy>=1.24,<3", "huggingface-hub>=0.25,<2"]

[project.optional-dependencies]
tts = ["torch>=2.2", "safetensors>=0.4", "soundfile>=0.12", "speechbrain>=1.0", "sentencepiece>=0.2", "pyyaml>=6"]
asr = ["faster-whisper>=1.1"]
chat = ["httpx>=0.27"]
studio = ["gradio>=4.44", "soundfile>=0.12"]
train = ["torch>=2.2", "safetensors>=0.4", "soundfile>=0.12", "pyyaml>=6", "peft>=0.12", "datasets>=2.19,<4", "scipy>=1.10", "librosa>=0.10", "sentencepiece>=0.2", "speechbrain>=1.0", "torchaudio"]
all = ["torch>=2.2", "safetensors>=0.4", "soundfile>=0.12", "speechbrain>=1.0", "sentencepiece>=0.2", "pyyaml>=6", "faster-whisper>=1.1", "httpx>=0.27", "gradio>=4.44", "peft>=0.12", "datasets>=2.19,<4", "scipy>=1.10", "librosa>=0.10", "sentencepiece>=0.2", "speechbrain>=1.0", "torchaudio"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.scripts]
ohamlab-voice = "ohamlab_voicestudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]
